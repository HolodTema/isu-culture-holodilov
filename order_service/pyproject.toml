[project]
name = "order-service"
version = "0.0.1"
description = "Fastapi microservice to CRUD orders"
authors = [
    {name = "artem",email = "art.holodilov@gmail.com"}
]
license = "ApacheLicense2.0"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.141.1"
uvicorn = {extras = ["standard"], version = "^0.53.0"}
httpx = "^0.28.1"
psycopg = {extras = ["binary"], version = "^3.3.6"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
